# =============================================================================
# Domain: expenses
# Entity: ExpenseCategory
# Description: An expense classification carrying the GL expense account
#              posts hit (Odoo models this via expensable products +
#              product-category accounts; the locked W1 decision is a
#              lighter own entity so People does not couple to the catalog
#              module before the finance wave composes it).
# =============================================================================

models:
  - name: ExpenseCategory
    collection: expense_categories
    description: "Expense classification with its GL expense account (per-category accounts)."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"

      code:
        type: string
        attributes: ["@required", "@length(max=64)"]
        description: "Short stable code (e.g. TRAVEL, MEAL) — unique per org unit among live rows; the per-unit unique is the composing service's tenancy decorator"

      name:
        type: string
        attributes: ["@required", "@length(max=200)"]
        description: "Human-readable category name"

      expense_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "GL expense account posts hit # logical FK accounting.account.id"

      default_tax_rate:
        type: decimal?
        description: "Optional default tax rate (percent) suggested at claim time"

      description:
        type: string?
        description: "Policy note shown to claimants (e.g. per-diem caps)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
      # code unique — one live category per code per org unit — is installed by
      # the composing service's tenancy decorator (org_unit_id-leading), not
      # declared here.
