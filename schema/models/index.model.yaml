# =============================================================================
# expenses Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from
# the module name by `metaphor module create`. `schema:` gives this module its
# OWN Postgres schema (migrations emit `CREATE SCHEMA expenses` and qualify
# tables as `expenses.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: expenses
version: 2
schema: expenses

# ADR-0014 company fence (declared at birth, W1 P3): expense claims, their
# categories and tax overlay rows are company-private (pillar-people H-4).
company_fence: strict
description: "employee expense claims — categories, tax overlay, GL posting + reimbursement seams"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model (Example skeleton removed).
imports:
  - expense_category.model.yaml
  - expense.model.yaml
  - expense_tax_line.model.yaml
