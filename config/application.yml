server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/expensesdb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/__MODULE__.log
module:
  name: __MODULE__
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: false
entities:
  expense:
    collection: expenses
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  expense_category:
    collection: expense_categories
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  expense_tax_line:
    collection: expense_tax_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
